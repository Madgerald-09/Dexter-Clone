<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <title>Dexter Stream Panel</title>
    <link rel="stylesheet" href="styles.css">
    <script src="overlay.js" defer></script>
  </head>
  <body class="overlay-body">
    <main class="overlay-window">
      <header class="overlay-titlebar"><div class="overlay-brand"><span class="brand-mark">D</span><span><strong>DEXTER</strong><small>QUICK PANEL</small></span></div><span class="overlay-live"><i></i> LOCAL</span><button id="overlay-close" class="overlay-close" type="button" aria-label="Hide panel">×</button></header>
      <div class="overlay-greeting"><span class="welcome-orbit overlay-orbit"><span class="welcome-star">✦</span></span><div><strong>Your desktop, in reach.</strong><small>Quick actions · no cloud</small></div></div>
      <div class="overlay-action-grid"><button data-command="list apps" type="button"><span>▦</span> Find an app</button><button data-command="screenshot" type="button"><span>▧</span> Screenshot</button><button data-command="open folder" type="button"><span>▱</span> Open folder</button><button data-command="help" type="button"><span>✦</span> Assistant</button></div>
      <footer class="overlay-footer"><span>Ctrl + Shift + O</span><button id="overlay-main" type="button">Open full assistant ↗</button></footer>
    </main>
  </body>
</html>
